[metadata]
name = napari-locpix
version = 0.0.8
description = Annotate point cloud data in napari (e.g. from single molecule localisation microscopy/SMLM)
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/AlistairCurd/napari-locpix
author = Oliver Umney
author_email = oliver.umney@icr.ac.uk
maintainer = Alistair Curd
maintainer_email = a.curd@leeds.ac.uk
license_expression = MIT
license_files = LICENSE
classifiers =
    Development Status :: 3 - Alpha
    Framework :: napari
    Intended Audience :: Science/Research
    Intended Audience :: Developers
    Operating System :: OS Independent
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Scientific/Engineering :: Image Processing
project_urls =
    Bug Tracker = https://github.com/AlistairCurd/napari-locpix/issues
    Documentation = https://github.com/AlistairCurd/napari-locpix#README.md
    Source Code = https://github.com/AlistairCurd/napari-locpix
    User Support = https://github.com/AlistairCurd/napari-locpix/issues

[options]
packages = find:
install_requires =
    numpy >=1.23, <3.0
    qtpy >=2.3, <3
    polars >=1.0, <2.0
    pyarrow >=12, <25

python_requires = >=3.11
include_package_data = True
package_dir =
    =src

# add your package requirements here

[options.packages.find]
where = src

[options.entry_points]
napari.manifest =
    napari-locpix = napari_locpix:napari.yaml

[options.extras_require]
testing =
    tox
    pytest<9  # https://docs.pytest.org/en/latest/contents.html
    pytest-cov  # https://pytest-cov.readthedocs.io/en/latest/
    pytest-qt<5  # https://pytest-qt.readthedocs.io/en/latest/
    napari[pyqt]

[options.package_data]
* = *.yaml
